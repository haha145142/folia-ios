name: Build unsigned FoliaPlayer IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FoliaPlayer/**'
      - 'FoliaPlayer.xcodeproj/**'
      - '.github/workflows/build-ipa.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.x
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort | tail -n 1 || true)"
          if [[ -n "$XCODE_APP" ]]; then
            sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild -version | grep -Eq 'Xcode 16\.' || {
            echo '::error::This workflow requires Xcode 16.x on the macos-15 runner.'
            exit 1
          }
          xcodebuild -list -project FoliaPlayer.xcodeproj

      - name: Archive app without code signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project FoliaPlayer.xcodeproj \
            -scheme FoliaPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/FoliaPlayer.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.xxx.folia \
            | tee "$RUNNER_TEMP/xcode-archive.log"

      - name: Package an unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/FoliaPlayer.xcarchive/Products/Applications/FoliaPlayer.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo '::error::FoliaPlayer.app was not found inside the Xcode archive.'
            find "$PWD/build/FoliaPlayer.xcarchive" -maxdepth 5 -name '*.app' -print || true
            exit 1
          fi

          # The IPA is deliberately unsigned; remove signing artifacts if any exist.
          rm -rf "$APP_PATH/_CodeSignature"
          rm -f "$APP_PATH/embedded.mobileprovision"
          plutil -lint "$APP_PATH/Info.plist"
          test -f "$APP_PATH/FoliaPlayer"

          mkdir -p "$PWD/build/ipa/Payload"
          ditto "$APP_PATH" "$PWD/build/ipa/Payload/FoliaPlayer.app"
          (
            cd "$PWD/build/ipa"
            /usr/bin/zip -qry FoliaPlayer-unsigned.ipa Payload
          )

          test -s "$PWD/build/ipa/FoliaPlayer-unsigned.ipa"
          echo "Created unsigned IPA:"
          ls -lh "$PWD/build/ipa/FoliaPlayer-unsigned.ipa"
          echo "Bundle ID in Info.plist:"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$PWD/build/ipa/Payload/FoliaPlayer.app/Info.plist"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoliaPlayer-unsigned-IPA
          path: build/ipa/FoliaPlayer-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
